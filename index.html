<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع الصلوات اليومية | Daily Prayer Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-md py-6 px-4">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold">تتبع الصلوات اليومية</h1>
                <p class="text-emerald-100 text-sm mt-1">Daily Prayer Verification Tracker</p>
            </div>
            <div class="bg-emerald-800 px-3 py-1 rounded-lg text-xs sm:text-sm font-semibold">
                مباشر / Live
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-4 mt-8 space-y-6">

        <!-- Card: Log Prayer -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-xl font-bold text-slate-800 mb-4 border-b border-slate-100 pb-3 flex items-center gap-2">
                <span>🕌</span> تأكيد أداء الصلاة
            </h2>

            <form id="prayerForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
                <!-- Select Prayer -->
                <div>
                    <label for="prayerName" class="block text-sm font-medium text-slate-700 mb-2">اختر الصلاة:</label>
                    <select id="prayerName" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition bg-slate-50">
                        <option value="الفجر">الفجر (Fajr)</option>
                        <option value="الظهر">الظهر (Dhuhr)</option>
                        <option value="العصر">العصر (Asr)</option>
                        <option value="المغرب">المغرب (Maghrib)</option>
                        <option value="العشاء">العشاء (Isha)</option>
                    </select>
                </div>

                <!-- Verification Method Selection -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">طريقة التوثيق:</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" id="btnMethodLocation" onclick="switchMethod('location')" 
                            class="py-3 px-4 border-2 border-emerald-600 bg-emerald-50 text-emerald-800 font-semibold rounded-lg flex justify-center items-center gap-2 transition">
                            📍 الموقع الجغرافي
                        </button>
                        <button type="button" id="btnMethodVideo" onclick="switchMethod('video')" 
                            class="py-3 px-4 border-2 border-slate-200 text-slate-600 font-semibold rounded-lg flex justify-center items-center gap-2 transition hover:bg-slate-50">
                            🎥 فيديو
                        </button>
                    </div>
                </div>

                <!-- Method 1: Location Block -->
                <div id="locationBlock" class="p-4 bg-slate-50 rounded-lg border border-slate-200 space-y-3">
                    <p class="text-sm text-slate-600">سيتم تحديد موقعك الجغرافي الحالي لتوثيق مكان أداء الصلاة.</p>
                    <button type="button" onclick="detectLocation()" class="w-full sm:w-auto bg-slate-800 text-white text-sm py-2 px-4 rounded-lg hover:bg-slate-700 transition">
                        تحديد موقعي الآن
                    </button>
                    <div id="locationStatus" class="text-sm font-medium text-emerald-700"></div>
                </div>

                <!-- Method 2: Video Upload Block -->
                <div id="videoBlock" class="p-4 bg-slate-50 rounded-lg border border-slate-200 space-y-3 hidden">
                    <p class="text-sm text-slate-600">قم برفع فيديو قصير يوثق أداء الصلاة:</p>
                    <input type="file" id="videoInput" accept="video/*" onchange="previewVideo(event)" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer">
                    <div id="videoPreviewContainer" class="hidden mt-3">
                        <video id="videoPreview" controls class="w-full max-h-60 rounded-lg bg-black"></video>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3.5 px-4 rounded-lg hover:bg-emerald-700 shadow-md transition">
                    تسجيل الصلاة
                </button>
            </form>
        </section>

        <!-- Card: Prayer History -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <span>📋</span> سجل الصلوات الموثقة
                </h2>
                <button onclick="clearHistory()" class="text-xs text-red-600 hover:underline">مسح السجل</button>
            </div>

            <div id="logsContainer" class="space-y-4">
                <p class="text-slate-400 text-center py-6">لا توجد تسجيلات حتى الآن.</p>
            </div>
        </section>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 space-y-2 w-[90%] max-w-sm"></div>

    <script>
        let selectedMethod = 'location';
        let currentLocationData = null;
        let currentVideoFile = null;

        // ---------- Toast ----------
        function showToast(message, type = 'info', actions = null, duration = 3000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');

            const colors = {
                success: 'bg-emerald-600',
                error: 'bg-red-600',
                info: 'bg-slate-800'
            };

            toast.className = `${colors[type] || colors.info} text-white text-sm font-medium px-4 py-3 rounded-lg shadow-lg flex items-center justify-between gap-3 transition-opacity duration-300`;

            const msgSpan = document.createElement('span');
            msgSpan.textContent = message;
            toast.appendChild(msgSpan);

            const dismiss = () => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            };

            if (actions) {
                const btnWrap = document.createElement('div');
                btnWrap.className = 'flex gap-2 shrink-0';
                actions.forEach(action => {
                    const btn = document.createElement('button');
                    btn.textContent = action.label;
                    btn.className = action.danger
                        ? 'bg-red-800 hover:bg-red-900 text-xs font-bold px-3 py-1.5 rounded-md transition'
                        : 'bg-white/20 hover:bg-white/30 text-xs font-bold px-3 py-1.5 rounded-md transition';
                    btn.onclick = () => { dismiss(); action.onClick(); };
                    btnWrap.appendChild(btn);
                });
                toast.appendChild(btnWrap);
                duration = 8000;
            }

            container.appendChild(toast);
            setTimeout(dismiss, duration);
        }

        // ---------- IndexedDB (video blobs) ----------
        function openVideoDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('prayerVideosDB', 1);
                req.onupgradeneeded = () => req.result.createObjectStore('videos');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveVideoBlob(id, blob) {
            const db = await openVideoDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('videos', 'readwrite');
                tx.objectStore('videos').put(blob, id);
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getVideoBlob(id) {
            const db = await openVideoDB();
            return new Promise((resolve, reject) => {
                const req = db.transaction('videos').objectStore('videos').get(id);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteVideoBlob(id) {
            const db = await openVideoDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('videos', 'readwrite');
                tx.objectStore('videos').delete(id);
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            });
        }

        function switchMethod(method) {
            selectedMethod = method;
            const btnLoc = document.getElementById('btnMethodLocation');
            const btnVid = document.getElementById('btnMethodVideo');
            const locBlock = document.getElementById('locationBlock');
            const vidBlock = document.getElementById('videoBlock');

            if (method === 'location') {
                btnLoc.className = "py-3 px-4 border-2 border-emerald-600 bg-emerald-50 text-emerald-800 font-semibold rounded-lg flex justify-center items-center gap-2 transition";
                btnVid.className = "py-3 px-4 border-2 border-slate-200 text-slate-600 font-semibold rounded-lg flex justify-center items-center gap-2 transition hover:bg-slate-50";
                locBlock.classList.remove('hidden');
                vidBlock.classList.add('hidden');
            } else {
                btnVid.className = "py-3 px-4 border-2 border-emerald-600 bg-emerald-50 text-emerald-800 font-semibold rounded-lg flex justify-center items-center gap-2 transition";
                btnLoc.className = "py-3 px-4 border-2 border-slate-200 text-slate-600 font-semibold rounded-lg flex justify-center items-center gap-2 transition hover:bg-slate-50";
                vidBlock.classList.remove('hidden');
                locBlock.classList.add('hidden');
            }
        }

        function detectLocation() {
            const status = document.getElementById('locationStatus');
            if (!navigator.geolocation) {
                status.innerText = "خاصية تحديد الموقع غير مدعومة في متصفحك.";
                status.className = "text-sm font-medium text-red-600";
                return;
            }

            status.innerText = "جاري جلب الموقع الجغرافي...";
            status.className = "text-sm font-medium text-amber-600";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    currentLocationData = {
                        lat: lat,
                        lng: lng,
                        mapUrl: `https://www.google.com/maps?q=${lat},${lng}`
                    };
                    status.innerHTML = `تم تحديد الموقع بنجاح!<br><span class="text-xs text-slate-500">خط العرض: ${lat.toFixed(4)}، خط الطول: ${lng.toFixed(4)}</span>`;
                    status.className = "text-sm font-medium text-emerald-700";
                },
                (error) => {
                    status.innerText = "تعذر تحديد الموقع. يرجى تفعيل إذن الوصول للموقع.";
                    status.className = "text-sm font-medium text-red-600";
                }
            );
        }

        function previewVideo(event) {
            const file = event.target.files[0];
            const container = document.getElementById('videoPreviewContainer');
            const videoElem = document.getElementById('videoPreview');

            if (file) {
                videoElem.src = URL.createObjectURL(file);
                currentVideoFile = file;
                container.classList.remove('hidden');
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            const prayerName = document.getElementById('prayerName').value;
            const timestamp = new Date().toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });

            if (selectedMethod === 'location' && !currentLocationData) {
                showToast("يرجى الضغط على 'تحديد موقعي الآن' أولاً.", 'error');
                return;
            }

            if (selectedMethod === 'video' && !currentVideoFile) {
                showToast("يرجى اختيار ملف فيديو أولاً.", 'error');
                return;
            }

            const id = Date.now();
            const record = {
                id: id,
                prayer: prayerName,
                time: timestamp,
                method: selectedMethod,
                location: currentLocationData,
                hasVideo: selectedMethod === 'video'
            };

            if (selectedMethod === 'video') {
                try {
                    await saveVideoBlob(id, currentVideoFile);
                } catch (err) {
                    showToast("تعذر حفظ الفيديو. حاول بملف أصغر.", 'error');
                    return;
                }
            }

            saveRecord(record);
            renderRecords();
            showToast(`تم تسجيل صلاة ${prayerName} بنجاح ✓`, 'success');

            // Reset
            currentLocationData = null;
            currentVideoFile = null;
            document.getElementById('locationStatus').innerText = '';
            document.getElementById('videoInput').value = '';
            document.getElementById('videoPreviewContainer').classList.add('hidden');
            document.getElementById('videoPreview').src = '';
        }

        function saveRecord(record) {
            let logs = JSON.parse(localStorage.getItem('prayerLogs') || '[]');
            logs.unshift(record);
            localStorage.setItem('prayerLogs', JSON.stringify(logs));
        }

        function getRecords() {
            return JSON.parse(localStorage.getItem('prayerLogs') || '[]');
        }

        function clearHistory() {
            showToast("هل أنت متأكد من مسح جميع السجلات؟", 'info', [
                { label: 'إلغاء', onClick: () => {} },
                {
                    label: 'نعم، امسح',
                    danger: true,
                    onClick: async () => {
                        const logs = getRecords();
                        for (const item of logs) {
                            if (item.method === 'video') {
                                try { await deleteVideoBlob(item.id); } catch (err) { /* already gone */ }
                            }
                        }
                        localStorage.removeItem('prayerLogs');
                        renderRecords();
                        showToast("تم مسح السجل بالكامل.", 'success');
                    }
                }
            ]);
        }

        function renderRecords() {
            const logs = getRecords();
            const container = document.getElementById('logsContainer');

            if (logs.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-center py-6">لا توجد تسجيلات حتى الآن.</p>`;
                return;
            }

            container.innerHTML = logs.map(item => {
                let verificationHTML = '';

                if (item.method === 'location' && item.location) {
                    verificationHTML = `
                        <div class="mt-2 text-xs bg-slate-50 p-2.5 rounded border border-slate-200">
                            <span class="font-semibold text-slate-700">📍 الموقع:</span> 
                            الإحداثيات (${item.location.lat.toFixed(4)}, ${item.location.lng.toFixed(4)})
                            <a href="${item.location.mapUrl}" target="_blank" class="block mt-1 text-emerald-600 font-medium hover:underline">
                                🔗 فتح على خرائط Google
                            </a>
                        </div>
                    `;
                } else if (item.method === 'video' && item.hasVideo) {
                    verificationHTML = `
                        <div class="mt-2 bg-slate-50 p-2.5 rounded border border-slate-200">
                            <span class="text-xs font-semibold text-slate-700 block mb-1">🎥 الفيديو المرفق:</span>
                            <video id="logVideo-${item.id}" controls class="w-full max-h-48 rounded bg-black"></video>
                        </div>
                    `;
                }

                return `
                    <div class="border border-slate-200 rounded-lg p-4 bg-white shadow-xs">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-lg font-bold text-emerald-700">صلاة ${item.prayer}</span>
                                <span class="text-xs text-slate-400 block">${item.time}</span>
                            </div>
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${item.method === 'location' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}">
                                ${item.method === 'location' ? 'موثق بموقع' : 'موثق بفيديو'}
                            </span>
                        </div>
                        ${verificationHTML}
                    </div>
                `;
            }).join('');

            // Load video blobs from IndexedDB into their <video> elements
            logs.filter(item => item.method === 'video' && item.hasVideo).forEach(async item => {
                const videoElem = document.getElementById(`logVideo-${item.id}`);
                if (!videoElem) return;
                try {
                    const blob = await getVideoBlob(item.id);
                    if (blob) videoElem.src = URL.createObjectURL(blob);
                } catch (err) { /* video unavailable */ }
            });
        }

        // Initial Load
        renderRecords();
    </script>
</body>
</html>
